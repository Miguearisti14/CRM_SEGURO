{% extends 'layout_form_base.html' %}
{% load static %}

{% block title %}Detalle del Cliente - ZuluAris CRM{% endblock %}

{% block form_content %}
<h2 class="titulo-seccion">Información del Cliente</h2>
<p class="descripcion-seccion">Consulta, edita o elimina los datos del cliente registrado.</p>

<!-- 🧾 Formulario principal (editar cliente) -->
<form method="POST" class="panel-formulario">
    {% csrf_token %}

    <div class="grupo-doble">
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" name="nombre" id="nombre" 
                   value="{{ cliente.nombre }}" readonly 
                   style="background-color: #e7e9ea;">
        </div>

    </div>

    <div class="grupo-doble">
        <div class="form-group">
            <label for="tipo_dni">Tipo de documento</label>
            <select name="tipo_dni" id="tipo_dni" required>
                {% for tipo in tipos_dni %}
                    <option value="{{ tipo.id }}" 
                            {% if cliente.id_tipo_dni and cliente.id_tipo_dni.id == tipo.id %}selected{% endif %}>
                        {{ tipo.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        
        <div class="form-group">
            <label for="dni">Documento</label>
            <input type="text" name="dni" id="dni" 
                   value="{{ cliente.dni }}" readonly 
                   style="background-color: #e7e9ea;">
        </div>

        
    </div>

    <div class="grupo-doble">
        <div class="form-group">
            <label for="celular">Celular</label>
            <input type="text" name="celular" id="celular" 
                   value="{{ cliente.celular |floatformat:0 }}">
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="text" name="telefono" id="telefono" 
                   value="{{ cliente.telefono |floatformat:0}}">
        </div>
    </div>

        <div class="grupo-doble">

            <div class="form-group">
                <label for="direccion">Dirección</label>
                <input type="text" name="direccion" id="direccion" 
                    value="{{ cliente.direccion|default:'' }}">
            </div>

            <div class="form-group">
                <label for="ciudad">Ciudad</label>
                <select name="ciudad" id="ciudad">
                    <option value="">-- Selecciona --</option>
                    {% for c in ciudades %}
                        <option value="{{ c.id }}" 
                            {% if cliente.id_ciudad and cliente.id_ciudad.id == c.id %}selected{% endif %}>
                            {{ c.descripcion }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

    
    <div class="grupo-doble">
        <div class="form-group">
            <label for="tipo_cuenta">Tipo de cuenta bancaria</label>
            <select name="tipo_cuenta" id="tipo_cuenta">
                <option value="">-- Selecciona --</option>
                {% for tipo in tipos_cuenta %}
                    <option value="{{ tipo.id }}" 
                        {% if cliente.tipo_cuenta and cliente.tipo_cuenta.id == tipo.id %}selected{% endif %}>
                        {{ tipo.descripcion }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="numero_cuenta">Número de cuenta bancaria</label>
            <input type="text" name="numero_cuenta" id="numero_cuenta" 
                   value="{{ cliente.cuenta_bancaria|default:'' }}">
        </div>
    </div>

    <div class="acciones-formulario">
        <button type="submit" class="btn-guardar">Guardar cambios</button>
        <a href="{% url 'gestionar_clientes' %}" class="btn-cancelar">Cancelar</a>
    </div>
</form>

<!-- 🗑️ Formulario de eliminación independiente -->
<form method="POST" action="{% url 'eliminar_cliente' cliente.dni %}" 
      onsubmit="return confirm('¿Estás seguro de eliminar este cliente?')" 
      class="form-eliminar">
    {% csrf_token %}
    <div class="acciones-formulario eliminar">
        <button type="submit" class="btn-eliminar">Eliminar cliente</button>
    </div>
</form>

{% endblock %}
